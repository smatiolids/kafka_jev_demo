<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kafka JEV demo execution results</title>
  <desc id="desc">Dashboard summarizing 20,000 evaluations, 279 millisecond p95 latency, 84 cent cost, no dead-letter records, and routing distributions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a35"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Execution results</text>
  <text x="60" y="92" fill="#a5b4fc" font-family="Inter,Arial,sans-serif" font-size="16">4,000 tickets × 5 routing policies · resolved model jev-1.14.0</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="55" y="125" width="255" height="130" rx="22" fill="url(#card)" stroke="#3b82f6"/>
    <text x="82" y="163" fill="#93c5fd" font-size="14" font-weight="700">EVALUATIONS</text>
    <text x="82" y="216" fill="#fff" font-size="42" font-weight="800">20,000</text>
    <rect x="330" y="125" width="255" height="130" rx="22" fill="url(#card)" stroke="#22d3ee"/>
    <text x="357" y="163" fill="#67e8f9" font-size="14" font-weight="700">JEV LATENCY · P95</text>
    <text x="357" y="216" fill="#fff" font-size="42" font-weight="800">279 ms</text>
    <rect x="605" y="125" width="255" height="130" rx="22" fill="url(#card)" stroke="#a78bfa"/>
    <text x="632" y="163" fill="#c4b5fd" font-size="14" font-weight="700">TOTAL COST</text>
    <text x="632" y="216" fill="#fff" font-size="42" font-weight="800">USD 0.84</text>
    <rect x="880" y="125" width="265" height="130" rx="22" fill="url(#card)" stroke="#34d399"/>
    <text x="907" y="163" fill="#6ee7b7" font-size="14" font-weight="700">DLQ RECORDS</text>
    <text x="907" y="216" fill="#fff" font-size="42" font-weight="800">0</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="300" width="530" height="390" rx="24" fill="#f8fafc"/>
    <text x="85" y="342" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Choice · department</text>
    <text x="85" y="368" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">4,000 routed tickets</text>
    <g font-family="Inter,Arial,sans-serif" font-size="13">
      <text x="85" y="415" fill="#334155">technical_support</text><rect x="230" y="400" width="286" height="20" rx="10" fill="#2563eb"/><text x="526" y="415" fill="#1e3a8a" text-anchor="end">3,237</text>
      <text x="85" y="462" fill="#334155">billing</text><rect x="230" y="447" width="37" height="20" rx="10" fill="#14b8a6"/><text x="526" y="462" fill="#115e59" text-anchor="end">414</text>
      <text x="85" y="509" fill="#334155">general_support</text><rect x="230" y="494" width="30" height="20" rx="10" fill="#8b5cf6"/><text x="526" y="509" fill="#5b21b6" text-anchor="end">341</text>
      <text x="85" y="556" fill="#334155">account_security</text><rect x="230" y="541" width="3" height="20" rx="2" fill="#f59e0b"/><text x="526" y="556" fill="#92400e" text-anchor="end">7</text>
      <text x="85" y="603" fill="#334155">retention</text><rect x="230" y="588" width="2" height="20" rx="1" fill="#ef4444"/><text x="526" y="603" fill="#991b1b" text-anchor="end">1</text>
    </g>
    <text x="85" y="652" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Average confidence: 0.93</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="615" y="300" width="530" height="180" rx="24" fill="#f8fafc"/>
    <text x="645" y="342" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Noul · requires_human &gt; 0.8</text>
    <rect x="645" y="382" width="257" height="38" rx="12" fill="#14b8a6"/>
    <rect x="902" y="382" width="209" height="38" rx="12" fill="#6366f1"/>
    <text x="773" y="407" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">to_agent · 2,203</text>
    <text x="1006" y="407" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">to_human · 1,797</text>
    <text x="645" y="450" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">55.1% automated · 44.9% human assistance</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="615" y="510" width="530" height="180" rx="24" fill="#f8fafc"/>
    <text x="645" y="552" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Score · urgency &gt; 2</text>
    <rect x="645" y="592" width="283" height="38" rx="12" fill="#3b82f6"/>
    <rect x="928" y="592" width="183" height="38" rx="12" fill="#f59e0b"/>
    <text x="786" y="617" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">normal · 2,427</text>
    <text x="1019" y="617" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">urgent · 1,573</text>
    <text x="645" y="660" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">60.7% normal · 39.3% urgent</text>
  </g>
</svg>
