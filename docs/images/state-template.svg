<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic State construction with a template</title>
  <desc id="desc">A Kafka source record is transformed by a state template into the exact Evaluation State sent to JEV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748b" flood-opacity=".2"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Building Evaluation State dynamically</text>
  <text x="60" y="96" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">Select, label, and default only the fields the model needs</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="310" height="430" rx="24" fill="#0f172a"/>
    <text x="85" y="190" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">SOURCE RECORD</text>
    <text x="85" y="230" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="15">key</text>
    <text x="85" y="257" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="18">ticket-42</text>
    <line x1="85" y1="280" x2="335" y2="280" stroke="#334155"/>
    <text x="85" y="318" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="15">value</text>
    <text x="85" y="354" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="16">{</text>
    <text x="103" y="386" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="15">"subject":</text>
    <text x="199" y="386" fill="#5eead4" font-family="ui-monospace,monospace" font-size="15">"Payment failed"</text>
    <text x="103" y="420" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="15">"body":</text>
    <text x="181" y="420" fill="#5eead4" font-family="ui-monospace,monospace" font-size="15">"Charged twice"</text>
    <text x="103" y="454" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="15">"email":</text>
    <text x="190" y="454" fill="#fda4af" font-family="ui-monospace,monospace" font-size="15">"hidden"</text>
    <text x="85" y="486" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="16">}</text>
    <rect x="84" y="515" width="215" height="34" rx="8" fill="#3f1d2e"/>
    <text x="101" y="537" fill="#fda4af" font-family="Inter,Arial,sans-serif" font-size="13">sensitive field excluded</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="190" width="310" height="340" rx="24" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="475" y="234" fill="#4338ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">STATE TEMPLATE</text>
    <g font-family="ui-monospace,monospace" font-size="16">
      <text x="475" y="288" fill="#0f172a">Ticket:</text><text x="545" y="288" fill="#2563eb">${key}</text>
      <text x="475" y="335" fill="#0f172a">Subject:</text><text x="555" y="335" fill="#2563eb">${value:/subject:</text>
      <text x="475" y="363" fill="#2563eb">-(no subject)}</text>
      <text x="475" y="410" fill="#0f172a">Message:</text><text x="555" y="410" fill="#2563eb">${value:/body:</text>
      <text x="475" y="438" fill="#2563eb">-(no message)}</text>
    </g>
    <rect x="475" y="470" width="244" height="34" rx="8" fill="#eef2ff"/>
    <text x="492" y="492" fill="#4338ca" font-family="Inter,Arial,sans-serif" font-size="13">missing values receive defaults</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="145" width="310" height="430" rx="24" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="865" y="190" fill="#0e7490" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">EVALUATION STATE</text>
    <text x="865" y="242" fill="#164e63" font-family="ui-monospace,monospace" font-size="17">Ticket: ticket-42</text>
    <text x="865" y="288" fill="#164e63" font-family="ui-monospace,monospace" font-size="17">Subject:</text>
    <text x="865" y="318" fill="#0f172a" font-family="ui-monospace,monospace" font-size="17">Payment failed</text>
    <text x="865" y="366" fill="#164e63" font-family="ui-monospace,monospace" font-size="17">Message:</text>
    <text x="865" y="396" fill="#0f172a" font-family="ui-monospace,monospace" font-size="17">Charged twice</text>
    <line x1="865" y1="438" x2="1115" y2="438" stroke="#a5f3fc"/>
    <text x="865" y="478" fill="#0e7490" font-family="Inter,Arial,sans-serif" font-size="14">Exact text sent to JEV</text>
    <text x="865" y="508" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Approved fields only</text>
  </g>

  <path d="M375 360H428" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M765 360H818" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
