# Kafka cluster the worker consumes the messages topic from and stores its state in.
# The address and credentials come from .env. For an unauthenticated cluster, delete the
# security lines and their consumer.* copies.
bootstrap.servers=${env:KAFKA_BOOTSTRAP_SERVERS}
group.id=kafka-jev-confluent_platform-connect

# Resolves ${env:NAME} references from the container environment. compose.yaml passes the
# Kafka address and credentials from .env, so they live in one place.
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${env:KAFKA_API_KEY}" password="${env:KAFKA_API_SECRET}";
# The sink task's consumer needs the same credentials. The connector configures its own
# producer for the output and dead-letter topics in connector.json.
consumer.security.protocol=SASL_SSL
consumer.sasl.mechanism=PLAIN
consumer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${env:KAFKA_API_KEY}" password="${env:KAFKA_API_SECRET}";

# Required by the worker; connector.json overrides them for the connector.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter

config.storage.topic=_kafka-jev-confluent_platform-connect-configs
offset.storage.topic=_kafka-jev-confluent_platform-connect-offsets
status.storage.topic=_kafka-jev-confluent_platform-connect-status
# -1 uses the cluster's default replication factor.
config.storage.replication.factor=-1
offset.storage.replication.factor=-1
status.storage.replication.factor=-1

plugin.path=/opt/kafka/plugins
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect

offset.flush.interval.ms=1000
