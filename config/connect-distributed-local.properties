# Kafka Connect worker settings for compose.kafka.yaml.
bootstrap.servers=${env:KAFKA_BOOTSTRAP_SERVERS}
group.id=kafka-jev-local-connect

config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

security.protocol=PLAINTEXT
consumer.security.protocol=PLAINTEXT

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter

config.storage.topic=_kafka-jev-local-connect-configs
offset.storage.topic=_kafka-jev-local-connect-offsets
status.storage.topic=_kafka-jev-local-connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

plugin.path=/opt/kafka/plugins
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect

offset.flush.interval.ms=1000
