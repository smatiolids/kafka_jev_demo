name: kafka-jev

# Runs only Kafka Connect with the Jev connector, against an existing Kafka cluster.
# Fill in the CHANGE_ME values in config/ before starting. See README.md.

services:
  connect:
    image: ${CONNECT_IMAGE:-kafka-jev-connect:local}
    build:
      context: .
    hostname: connect
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      CONNECTOR_NAME: ${CONNECTOR_NAME:-jev}
      CONNECTORS: ${CONNECTORS:-}
      # Kafka credentials from .env, referenced as ${env:...} in config/.
      # CONNECT_KAFKA_BOOTSTRAP_SERVERS lets containers use Kafka's internal
      # listener while host-side scripts use KAFKA_BOOTSTRAP_SERVERS.
      KAFKA_BOOTSTRAP_SERVERS: ${CONNECT_KAFKA_BOOTSTRAP_SERVERS:-${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}}
      KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?Set TYPESAFE_API_KEY in .env}
      # Topics must already exist; the connector does not create them. CREATE_TOPICS
      # (comma-separated) creates them at startup, but only on a PLAINTEXT cluster
      # reachable at BOOTSTRAP_SERVERS.
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS:-}
      CREATE_TOPICS: ${CREATE_TOPICS:-}
    volumes:
      # Relative paths resolve against this folder.
      - ${CONNECT_WORKER_CONFIG_FILE:-./config/connect-distributed.properties}:/etc/kafka-jev/connect-distributed.properties:ro
      - ${CONNECTOR_CONFIG_FILE:-./config/connector.json}:/etc/kafka-jev/connector.json:ro
      - ./config:/etc/kafka-jev/config:ro
      # Private CA of the Kafka cluster. Remove for clusters with publicly trusted certificates.
      - ${KAFKA_CA_FILE:-./kafka-ca.crt}:/etc/kafka-jev/kafka-ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "items=$${CONNECTORS:-$${CONNECTOR_NAME}:/etc/kafka-jev/connector.json}; for item in $$(echo \"$${items}\" | tr ',' ' '); do name=$${item%%:*}; status=$$(curl --fail --silent http://localhost:8083/connectors/$${name}/status) || exit 1; echo \"$${status}\" | grep -q '\"connector\":{\"state\":\"RUNNING\"' || exit 1; if echo \"$${status}\" | grep -q '\"state\":\"FAILED\"'; then exit 1; fi; done; exit 0"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
